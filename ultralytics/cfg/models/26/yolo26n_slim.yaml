# Ultralytics YOLO26 Yu-style slim-backbone model
# Shared convolution weights with width-specific BatchNorm statistics

nc: 80
end2end: True
reg_max: 1

# Base Ultralytics architecture scale.
scale: n

# Runtime slimmable widths.
slim_widths: [1.0, 0.875, 0.75, 0.625, 0.5]

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, SlimConv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, SlimConv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, SlimC3k2, [256, False, 0.25]]
  - [-1, 1, SlimConv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, SlimC3k2, [512, False, 0.25]]
  - [-1, 1, SlimConv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, SlimC3k2, [512, True]]
  - [-1, 1, SlimConv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, SlimC3k2, [1024, True]]
  - [-1, 1, SlimSPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, SlimC2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, SlimConcat, [1]]
  - [-1, 2, SlimC3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, SlimConcat, [1]]
  - [-1, 2, SlimC3k2, [256, True]] # 16-P3

  - [-1, 1, SlimConv, [256, 3, 2]]
  - [[-1, 13], 1, SlimConcat, [1]]
  - [-1, 2, SlimC3k2, [512, True]] # 19-P4

  - [-1, 1, SlimConv, [512, 3, 2]]
  - [[-1, 10], 1, SlimConcat, [1]]
  - [-1, 1, SlimC3k2, [1024, True, 0.5, True]] # 22-P5

  - [[16, 19, 22], 1, SlimDetect, [nc]]